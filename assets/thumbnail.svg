<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Design AI Skills by Faris</title>
  <desc id="description">Two bilingual AI skills for auditing designs and pressure-testing ideas in Claude and Codex.</desc>

  <rect width="1280" height="720" fill="#111827"/>
  <rect x="0" y="0" width="16" height="720" fill="#38BDF8"/>
  <rect x="16" y="0" width="8" height="720" fill="#FB7185"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="0">
    <text x="72" y="92" fill="#9CA3AF" font-size="22" font-weight="700">OPEN AI SKILL COLLECTION</text>
    <text x="72" y="180" fill="#F9FAFB" font-size="66" font-weight="800">Design AI Skills</text>
    <text x="72" y="228" fill="#D1D5DB" font-size="26" font-weight="500">Audit deeply. Persuade clearly.</text>

    <g transform="translate(72 286)">
      <rect width="548" height="268" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/>
      <rect width="10" height="268" rx="5" fill="#38BDF8"/>
      <circle cx="68" cy="62" r="26" fill="#0C4A6E"/>
      <path d="M56 62L64 70L81 53" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="57" fill="#F9FAFB" font-size="28" font-weight="750">Design Audit Panel</text>
      <text x="112" y="86" fill="#9CA3AF" font-size="18" font-weight="500">Seven expert perspectives</text>

      <text x="40" y="142" fill="#D1D5DB" font-size="20">Find friction, accessibility risks,</text>
      <text x="40" y="174" fill="#D1D5DB" font-size="20">business gaps, and the next best fix.</text>

      <rect x="40" y="210" width="112" height="34" rx="6" fill="#0C4A6E"/>
      <text x="61" y="233" fill="#BAE6FD" font-size="15" font-weight="700">PRIORITIZE</text>
      <rect x="164" y="210" width="98" height="34" rx="6" fill="#064E3B"/>
      <text x="186" y="233" fill="#A7F3D0" font-size="15" font-weight="700">IMPROVE</text>
    </g>

    <g transform="translate(660 286)">
      <rect width="548" height="268" rx="8" fill="#1F2937" stroke="#374151" stroke-width="2"/>
      <rect width="10" height="268" rx="5" fill="#FB7185"/>
      <circle cx="68" cy="62" r="26" fill="#881337"/>
      <path d="M55 69L68 50L81 69M59 64H77" stroke="#FDA4AF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112" y="57" fill="#F9FAFB" font-size="28" font-weight="750">Devil's Advocate</text>
      <text x="112" y="86" fill="#9CA3AF" font-size="18" font-weight="500">Objections into conviction</text>

      <text x="40" y="142" fill="#D1D5DB" font-size="20">Expose the hardest objections, then</text>
      <text x="40" y="174" fill="#D1D5DB" font-size="20">build credible answers and a pitch.</text>

      <rect x="40" y="210" width="124" height="34" rx="6" fill="#881337"/>
      <text x="61" y="233" fill="#FECDD3" font-size="15" font-weight="700">CHALLENGE</text>
