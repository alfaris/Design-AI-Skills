      <text x="198" y="233" fill="#FDE68A" font-size="15" font-weight="700">CONVINCE</text>
    </g>

    <line x1="72" y1="606" x2="1208" y2="606" stroke="#374151" stroke-width="2"/>
    <text x="72" y="660" fill="#F9FAFB" font-size="22" font-weight="700">CLAUDE + CODEX</text>
    <text x="288" y="660" fill="#9CA3AF" font-size="20">English + Arabic</text>

